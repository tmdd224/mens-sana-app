services:
  - type: web
    name: mens-sana-demo
    runtime: python
    plan: free
    branch: main
    buildCommand: cd mens-sana && python -B -m unittest discover -s tests -v
    startCommand: cd mens-sana && python -B server.py
    healthCheckPath: /
    envVars:
      - key: MENSSANA_DEMO
        value: "1"
      - key: MENSSANA_HOST
        value: "0.0.0.0"
      - key: MENSSANA_COOKIE_SECURE
        value: "1"
      - key: MENSSANA_DB_PATH
        value: /tmp/mens_sana.db
